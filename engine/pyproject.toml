[project]
name = "bk-engine"
version = "0.1.0"
description = "Ball Knowledge: Euroleague data ingest, player attribute ratings and set simulation"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy>=2.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
